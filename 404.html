<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Aarya Consultants</title>
  <meta name="description" content="The page you are looking for does not exist or has been relocated. Explore our fiduciary wealth, tax, and legal advisory services.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@400..800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Manrope:wght@400..800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">
  <style>
    :root {
      --navy: #081b45;
      --navy-dark: #040e25;
      --red: #e31e24;
      --paper: #f8fbff;
      --muted: #546478;
      --font-display: 'Manrope', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--paper);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 580px;
      background: #fff;
      border: 1px solid rgba(8,27,69,0.08);
      border-radius: 28px;
      padding: 48px 36px;
      box-shadow: 0 12px 38px rgba(8,27,69,0.08);
    }
    .num {
      font: 800 clamp(72px, 12vw, 110px) var(--font-display);
      color: var(--red);
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font: 800 clamp(22px, 3.5vw, 30px) var(--font-display);
      color: var(--navy);
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 24px;
      border-radius: 100px;
      font: 700 14px var(--font-display);
      text-decoration: none;
      transition: all .2s;
    }
    .btn.primary {
      background: var(--red);
      color: #fff;
    }
    .btn.primary:hover { background: #c41419; }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--navy);
      color: var(--navy);
    }
    .btn.secondary:hover { background: var(--navy); color: #fff; }
  </style>
  <link rel="stylesheet" href="enhancements.css">
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <h1>Page Not Found</h1>
    <p>The destination you requested has moved or is unavailable. Return to our homepage or use our interactive calculators.</p>
    <div class="actions">
      <a href="index.html" class="btn primary">Return to Home</a>
      <a href="tools.html" class="btn secondary">Financial Calculators</a>
      <a href="contact.html" class="btn secondary">Contact Us</a>
    </div>
  </div>
  <script defer src="enhancements.js"></script>
</body>
</html>
